<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANITVA — Chapter 1 Multi-Game Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#172033;background:linear-gradient(135deg,#eaf7ff,#fff6e5,#f3ecff);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}header{background:linear-gradient(135deg,#192f7b,#6849d3);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 7px 24px #17203344}.top{max-width:1100px;margin:auto;padding:13px 16px;display:flex;align-items:center;gap:14px}.back{color:#fff;text-decoration:none;font-weight:850}.brand{font-weight:1000;font-size:22px;flex:1}.xp{background:#ffffff1e;padding:9px 14px;border-radius:14px;font-weight:900}.progress{height:7px;background:#ffffff25}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd44d,#fff,#83eaff);transition:.5s}
main{max-width:1100px;margin:auto;padding:24px 15px 60px}.hero{text-align:center;padding:8px 0 20px}.hero h1{font-size:clamp(31px,6vw,54px);margin:0}.hero p{color:#61708a;font-size:17px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}.node{background:#ffffffdf;border:2px solid #e1e6f2;border-radius:18px;padding:11px 6px;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 6px 17px #17203310}.node:hover{transform:translateY(-5px)}.node.lock{opacity:.45;filter:grayscale(1);cursor:not-allowed}.node.active{border-color:#6754d6;box-shadow:0 0 0 4px #6754d61a,0 9px 22px #17203315}.node .ico{font-size:31px}.node b{display:block;font-size:12px;margin-top:4px}
.game{background:#ffffffed;border-radius:30px;box-shadow:0 18px 55px #1720331c;overflow:hidden;border:1px solid #fff}.head{background:linear-gradient(100deg,#eff3ff,#faf5ff);padding:17px 22px;display:flex;align-items:center;gap:13px}.char{width:62px;height:62px;border-radius:21px;background:#fff;display:grid;place-items:center;font-size:38px;box-shadow:0 7px 16px #17203315;animation:float 2.3s infinite}.head h2{margin:0}.small{font-size:12px;color:#68758d;font-weight:850;text-transform:uppercase;letter-spacing:1px}@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}.body{padding:24px}.challenge{background:linear-gradient(135deg,#fff,#f7f8ff);border:2px solid #e6e9f3;border-radius:25px;padding:25px;text-align:center}.tag{color:#6754d6;font-size:12px;font-weight:950;letter-spacing:1.5px}.q{font-size:clamp(23px,4.5vw,35px);font-weight:950;margin:10px auto;line-height:1.25}.visual{font-size:clamp(25px,5vw,45px);font-weight:950;letter-spacing:4px;color:#273b82;margin:12px 0}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:18px}.btnopt{min-height:68px;border:2px solid #dfe4ef;background:#fff;border-radius:18px;padding:13px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #dfe4ef;transition:.12s}.btnopt:hover{transform:translateY(-3px)}.btnopt.ok{background:#dcfce9;border-color:#20a35b;box-shadow:0 5px 0 #20a35b;animation:pop .45s}.btnopt.bad{background:#ffe4e4;border-color:#ef5350;box-shadow:0 5px 0 #ef5350;animation:shake .4s}@keyframes pop{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}.tile{min-width:70px;padding:16px 12px;background:#eef2ff;border:2px solid #cfd8ff;border-radius:15px;font-size:21px;font-weight:950;cursor:pointer;touch-action:none}.tile.selected{opacity:.45;transform:scale(.94)}.dropzone{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:74px;padding:12px;border:3px dashed #b8c1d9;border-radius:18px;background:#fafbff}.drop{min-width:65px;padding:12px;background:#fff;border-radius:12px;border:2px solid #d8dfed;font-weight:900}
.objects{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:15px}.obj{font-size:45px;padding:8px;border-radius:15px;cursor:pointer;border:2px solid transparent}.obj.sel{background:#fff0b8;border-color:#e3a800;transform:scale(1.08)}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.matchcol{display:grid;gap:10px}.matchbtn{padding:14px;border:2px solid #dce2ef;border-radius:15px;background:#fff;font-weight:850;font-size:16px;cursor:pointer}.matchbtn.sel{border-color:#6754d6;background:#f0edff}.matchbtn.matched{background:#dcfce9;border-color:#20a35b}
.feedback{text-align:center;min-height:48px;font-size:18px;font-weight:900;margin-top:15px}.hint{text-align:center;color:#68758d;font-size:14px}.actions{text-align:center;margin-top:8px}.next,.submit{border:0;color:#fff;background:linear-gradient(135deg,#4058c9,#8155d9);border-radius:14px;padding:13px 21px;font-weight:950;font-size:16px;cursor:pointer;display:none}
.overlay{position:fixed;inset:0;background:#132044dd;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;overflow:hidden}.win{position:relative;background:linear-gradient(145deg,#fff,#fff9ea);border-radius:34px;padding:34px 22px;text-align:center;max-width:650px;width:100%;animation:win .65s cubic-bezier(.2,1.5,.4,1);box-shadow:0 30px 100px #0008}@keyframes win{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}.percent{font-size:clamp(75px,16vw,120px);font-weight:1000;line-height:1;background:linear-gradient(90deg,#ffad1f,#ff4f87,#7250dd);-webkit-background-clip:text;color:transparent;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.07)}}.win h2{font-size:clamp(34px,7vw,55px);color:#263b80;margin:3px}.spark{position:absolute;top:-35px;font-size:26px;animation:fall 2.7s linear infinite}.spark:nth-child(1){left:3%}.spark:nth-child(2){left:18%;animation-delay:.4s}.spark:nth-child(3){left:33%;animation-delay:1s}.spark:nth-child(4){left:50%;animation-delay:.2s}.spark:nth-child(5){left:68%;animation-delay:.8s}.spark:nth-child(6){left:84%;animation-delay:1.3s}.spark:nth-child(7){left:95%;animation-delay:.5s}@keyframes fall{to{transform:translateY(650px) rotate(540deg);opacity:0}}.close{border:0;background:#263b80;color:#fff;padding:14px 22px;border-radius:13px;font-weight:900}
@media(max-width:760px){.map{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.match{grid-template-columns:1fr}.node:last-child{grid-column:1/-1}}
</style></head>
<body>
<header><div class="top"><a class="back" href="student.html">← Back</a><div class="brand">✨ GANITVA</div><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="progress"><i id="bar"></i></div></header>
<main><div class="hero"><h1>🏔️ Pattern Mountains</h1><p>Different games. Different challenges. Same mathematical adventure!</p></div><div class="map" id="map"></div>
<section class="game"><div class="head"><div class="char" id="char">🧑‍🚀</div><div><div class="small" id="mission">Mission 1 of 10</div><h2 id="name">Pattern Detective</h2></div></div><div class="body"><div id="gameArea"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hint" id="hint"></div><div class="actions"><button class="next" id="next">Next Mission 🚀</button></div></div></section></main>
<div class="overlay" id="overlay"><div class="win"><span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span><span class="spark">◆</span><span class="spark">✧</span><span class="spark">✦</span><span class="spark">✧</span><div style="font-size:58px">🎉🏆✨</div><div class="percent">100%</div><h2>YOU DID IT!</h2><p style="font-size:18px;font-weight:800">You conquered all 10 missions!</p><p>🌟 <b>Pattern Master</b> unlocked! 🌟</p><button class="close" onclick="overlay.style.display='none'">Keep Exploring 🚀</button></div></div>
<script>
const missions=[
{icon:"🔍",name:"Pattern Detective",type:"mcq"},
{icon:"🧩",name:"Build the Sequence",type:"order"},
{icon:"🟦",name:"Match the Pattern",type:"match"},
{icon:"⚡",name:"Square Builder",type:"build"},
{icon:"🔷",name:"Shape Sorter",type:"matchshape"},
{icon:"🚂",name:"Pattern Train",type:"mcq"},
{icon:"🔗",name:"Pattern Connect",type:"matchnum"},
{icon:"🕵️",name:"Pattern Mystery",type:"mcq"},
{icon:"❄️",name:"Koch Lab",type:"mcq"},
{icon:"👑",name:"Pattern Boss",type:"boss"}
];
let unlocked=+localStorage.getItem("g1unlocked")||1,current=0,xp=+localStorage.getItem("ganitvaXP")||0,answered=false;
const mapEl=document.getElementById("map"),area=document.getElementById("gameArea"),feedback=document.getElementById("feedback"),hint=document.getElementById("hint"),next=document.getElementById("next"),xpEl=document.getElementById("xp"),bar=document.getElementById("bar"),char=document.getElementById("char"),nameEl=document.getElementById("name"),missionEl=document.getElementById("mission");
xpEl.textContent=xp;
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function drawMap(){mapEl.innerHTML=missions.map((m,i)=>`<div class="node ${i<unlocked?"":"lock"} ${i===current?"active":""}" data-i="${i}"><div class="ico">${m.icon}</div><b>${i+1}. ${m.name}</b>${i<unlocked?"⭐":"🔒"}</div>`).join("");mapEl.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>{let i=+n.dataset.i;if(i<unlocked)start(i)}));bar.style.width=((unlocked-1)/9*100)+"%"}
function shell(g,visual,q){area.innerHTML=`<div class="challenge"><div class="tag">🧠 YOUR CHALLENGE</div><div class="visual">${visual||""}</div><div class="q">${q}</div></div>`}
function finish(ok,explain){if(answered)return;answered=true;if(ok){xp+=10;localStorage.setItem("ganitvaXP",xp);xpEl.textContent=xp;feedback.textContent="🎉 Brilliant! Correct! +10 XP";hint.textContent=explain||"You found the pattern!";if(current<9){unlocked=Math.max(unlocked,current+2);localStorage.setItem("g1unlocked",unlocked);next.style.display="inline-block"}else{feedback.textContent="🏆 PERFECT! Pattern Boss defeated!";hint.textContent="✨ 100% SUCCESS — Pattern Master achieved!";setTimeout(()=>overlay.style.display="flex",500)}}else{feedback.textContent="💡 Good try! Have another look at the pattern.";hint.textContent=explain||"";next.style.display="inline-block"}drawMap()}
function start(i){current=i;answered=false;next.style.display="none";feedback.textContent="";hint.textContent="";char.textContent=missions[i].icon;nameEl.textContent=missions[i].name;missionEl.textContent=`Mission ${i+1} of 10`;let t=missions[i].type;
if(t==="mcq")mcq(); else if(t==="order")order(); else if(t==="match")matching(); else if(t==="build")builder(); else if(t==="matchshape")shapeMatch(); else if(t==="matchnum")numberMatch(); else boss();drawMap()}
function mcq(){let sets=[
["2, 4, 6, 8, ___","What comes next?",[9,10,11,12],10,"Add 2 each time."],
["5, 10, 15, 20, ___","Find the next number.",[22,24,25,30],25,"Add 5 each time."],
["1, 4, 9, 16, ___","Which square number comes next?",[20,24,25,36],25,"These are 1², 2², 3², 4², 5²."],
["3, 6, 10, 15, ___","What is the next triangular number?",[18,20,21,25],21,"Add 3, 4, 5, then 6."],
["11, 13, 15, 17, ___","What comes next?",[18,19,20,21],19,"Add 2 each time."]
];let s=rand(sets);shell(missions[current],s[0],s[1]);area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="options">${shuffle(s[2]).map(x=>`<button class="btnopt">${x}</button>`).join("")}</div>`);area.querySelectorAll(".btnopt").forEach(b=>b.addEventListener("click",()=>{let ok=b.textContent==s[3];b.classList.add(ok?"ok":"bad");area.querySelectorAll(".btnopt").forEach(x=>x.disabled=true);finish(ok,s[4])}))}
function order(){let seq=rand([[1,3,6,10,15],[2,5,9,14,20],[3,6,10,15,21]]),correct=[...seq];shell(null,"🧩","Tap the number tiles in the correct order.");area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="tiles" id="tiles">${shuffle(seq).map(x=>`<button class="tile" data-v="${x}">${x}</button>`).join("")}</div><div class="dropzone" id="drop">Your sequence will appear here…</div>`);let chosen=[];area.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{if(b.classList.contains("selected"))return;b.classList.add("selected");chosen.push(+b.dataset.v);let d=document.createElement("span");d.className="drop";d.textContent=b.dataset.v;document.getElementById("drop").appendChild(d);if(chosen.length===correct.length)finish(chosen.every((v,j)=>v===correct[j]),"The pattern grows by consecutive amounts: +2, +3, +4, +5." )}))}
function matching(){let pairs=rand([[["1,3,5,7"],["Odd numbers"]],[["1,3,6,10"],["Triangular numbers"]],[["1,4,9,16"],["Square numbers"]]]);let all=[["1,3,5,7","Odd numbers"],["1,3,6,10","Triangular numbers"],["1,4,9,16","Square numbers"]];shell(null,"🟦","Match each pattern to its name. Tap one on each side.");area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="match"><div class="matchcol" id="left">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[0]}">${x[0]}</button>`).join("")}</div><div class="matchcol" id="right">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[1]}">${x[1]}</button>`).join("")}</div></div>`);let a=null,b=null;area.querySelectorAll("#left .matchbtn").forEach(x=>x.onclick=()=>{a=x;a.classList.add("sel");check()});area.querySelectorAll("#right .matchbtn").forEach(x=>x.onclick=()=>{b=x;b.classList.add("sel");check()});function check(){if(!a||!b)return;let ok=all.some(p=>p[0]===a.dataset.v&&p[1]===b.dataset.v);if(ok){a.classList.add("matched");b.classList.add("matched");a.disabled=b.disabled=true;a=b=null;if(!area.querySelectorAll("#left .matchbtn:not(:disabled)").length)finish(true,"Excellent matching! You recognized the number patterns.")}else{feedback.textContent="Try another match.";setTimeout(()=>{a?.classList.remove("sel");b?.classList.remove("sel");a=b=null;feedback.textContent=""},450)}}}
function builder(){let n=rand([2,3,4]);let target=n*n,odd=[...Array(n)].map((_,i)=>2*i+1);shell(null,"🟦 ".repeat(Math.min(target,12)),`Build a ${n} × ${n} square. Which odd number should be added last?`);area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="objects">${odd.map(x=>`<button class="obj" data-v="${x}">🟦 ${x}</button>`).join("")}</div><div class="hint">Remember: 1 + 3 + 5 + … builds square numbers.</div>`);area.querySelectorAll(".obj").forEach(b=>b.onclick=()=>{area.querySelectorAll(".obj").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");finish(+b.dataset.v===odd[odd.length-1],`The last odd number needed for ${n}² is ${odd[odd.length-1]}.`)})}
function shapeMatch(){let all=[["3","Triangle 🔺"],["4","Square 🟦"],["5","Pentagon ⬟"],["8","Octagon 🛑"]];shell(null,"🔷","Match the number of sides to the shape.");area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="match"><div class="matchcol" id="left">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[0]}">${x[0]} sides</button>`).join("")}</div><div class="matchcol" id="right">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[0]}">${x[1]}</button>`).join("")}</div></div>`);let a=null,b=null;area.querySelectorAll("#left .matchbtn").forEach(x=>x.onclick=()=>{a=x;check()});area.querySelectorAll("#right .matchbtn").forEach(x=>x.onclick=()=>{b=x;check()});function check(){if(!a||!b)return;if(a.dataset.v===b.dataset.v){a.classList.add("matched");b.classList.add("matched");a.disabled=b.disabled=true;a=b=null;if(!area.querySelectorAll("#left .matchbtn:not(:disabled)").length)finish(true,"Great! You matched side counts to the correct shapes.")}else{feedback.textContent="Not that pair — try again.";setTimeout(()=>{a=b=null;feedback.textContent=""},450)}}}
function numberMatch(){let all=[["1,3,5,7","16"],["1,3,5,7,9","25"],["1,3,5,7,9,11","36"]];shell(null,"🔗","Connect each odd-number sum to its square result.");area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="match"><div class="matchcol" id="left">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[0]}">${x[0]}</button>`).join("")}</div><div class="matchcol" id="right">${shuffle(all).map(x=>`<button class="matchbtn" data-v="${x[1]}">${x[1]}</button>`).join("")}</div></div>`);let a=null,b=null;area.querySelectorAll("#left .matchbtn").forEach(x=>x.onclick=()=>{a=x;check()});area.querySelectorAll("#right .matchbtn").forEach(x=>x.onclick=()=>{b=x;check()});function check(){if(!a||!b)return;if(all.some(p=>p[0]===a.dataset.v&&p[1]===b.dataset.v)){a.classList.add("matched");b.classList.add("matched");a.disabled=b.disabled=true;a=b=null;if(!area.querySelectorAll("#left .matchbtn:not(:disabled)").length)finish(true,"You connected odd-number sums with their square numbers.")}else{feedback.textContent="Look at how many odd numbers are being added.";setTimeout(()=>{a=b=null;feedback.textContent=""},500)}}}
function boss(){let sets=[["9, 11, 13, ___","15"],["1, 3, 6, 10, ___","15"],["Koch: 3 → 12 → 48 → ___","192"]];let s=rand(sets);shell(null,"👑","FINAL BOSS: "+s[0]);area.querySelector(".visual").textContent="";area.querySelector(".challenge").insertAdjacentHTML("beforeend",`<div class="options">${shuffle([s[1],String(+s[1]+2),String(+s[1]-2),String(+s[1]+5)]).map(x=>`<button class="btnopt">${x}</button>`).join("")}</div>`);area.querySelectorAll(".btnopt").forEach(b=>b.onclick=()=>{let ok=b.textContent===s[1];b.classList.add(ok?"ok":"bad");area.querySelectorAll(".btnopt").forEach(x=>x.disabled=true);finish(ok,"Final challenge solved!")})}
next.onclick=()=>start(Math.min(current+1,9));drawMap();start(0);
</script></body></html>
