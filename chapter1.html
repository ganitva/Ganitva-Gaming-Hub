<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANITVA — Chapter 1</title><style>
body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#243b80,#5169d8);color:white;padding:22px 6%}main{max-width:1000px;margin:25px auto;padding:0 18px}.panel{background:#fff;border-radius:20px;padding:25px;margin-bottom:18px;box-shadow:0 5px 20px #0001}.q{font-size:21px;font-weight:700;margin:18px 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}button{padding:13px;border:1px solid #dce2ef;background:#fff;border-radius:11px;font-size:16px;cursor:pointer}button:hover{background:#eef2ff}.ok{background:#dcfce7!important;border-color:#22c55e}.no{background:#fee2e2!important;border-color:#ef4444}.result{font-weight:700;margin-top:12px}.back{color:white;text-decoration:none}
</style></head><body><header><a class="back" href="student.html">← Student Portal</a><h1>Chapter 1 — Patterns in Mathematics</h1><p>10-game prototype</p></header><main id="app"></main>
<script>
const games=[
["game1","Pattern Detective","What comes next? 1, 3, 5, 7, ___",[8,9,10,11],9,"Odd numbers increase by 2."],
["game2","Sequence Builder","What is the next triangular number? 1, 3, 6, 10, ___",[12,14,15,16],15,"Add consecutive counting numbers: +2, +3, +4, +5."],
["game3","Picture the Numbers","Which number is both triangular and square?",[25,30,36,40],36,"36 is the 6th square and also the 8th triangular number."],
["game4","Odd-to-Square Lab","1 + 3 + 5 + 7 = ?",[14,16,18,20],16,"The sum of the first four odd numbers is 4² = 16."],
["game5","Polygon Lab","A regular polygon with 8 sides is called a…",["Hexagon","Heptagon","Octagon","Decagon"],"Octagon","The side-count sequence goes 3, 4, 5, 6, 7, 8…"],
["game6","Pattern Master","What is 2⁶?",[32,48,64,72],64,"2⁶ = 2×2×2×2×2×2 = 64."],
["game7","Sequence Relations","1+3=4, 3+6=9, 6+10=16, 10+15=25. These results are…",["Prime numbers","Square numbers","Cube numbers","Odd numbers"],"Square numbers","The results are 2², 3², 4², 5²."],
["game8","Shape Detective","In the regular-polygon sequence 3,4,5,6,7,8,9,10 sides, the 8th shape is a…",["Octagon","Nonagon","Decagon","Heptagon"],"Decagon","The 8th term is 10 sides."],
["game9","Koch Explorer","The Koch sequence begins 3, 12, 48. What comes next?",[96,144,192,240],192,"Each term is multiplied by 4."],
["game10","Final Pattern Quest","The sum of the first 10 odd numbers is…",[81,90,100,110],100,"The sum of the first n odd numbers is n²; for n=10, it is 100."]
];
let xp=Number(localStorage.getItem("ganitvaXP")||0),done=Number(localStorage.getItem("ganitvaDone")||0);
const app=document.getElementById("app");
games.forEach((g,i)=>{let el=document.createElement("section");el.className="panel";el.id=g[0];el.innerHTML=`<h2>Game ${i+1}: ${g[1]}</h2><div class="q">${g[2]}</div><div class="options">${g[3].map((o,j)=>`<button data-v="${o}">${o}</button>`).join("")}</div><div class="result"></div>`;app.appendChild(el);
el.querySelectorAll("button").forEach(b=>b.onclick=()=>{let ok=String(b.dataset.v)===String(g[4]);el.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add(ok?"ok":"no");el.querySelector(".result").textContent=ok?"✓ Correct! "+g[5]:"✗ Not quite. Correct answer: "+g[4]+". "+g[5];if(ok){xp+=10;localStorage.setItem("ganitvaXP",xp)}done++;localStorage.setItem("ganitvaDone",done)});});
</script></body></html>
