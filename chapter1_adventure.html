<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANITVA — Pattern Mountains</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(#eaf4ff,#fff8ea);color:#172033}
header{padding:18px 5%;background:linear-gradient(135deg,#263b8f,#5c6ee1);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900}.xp{background:#ffffff22;padding:9px 13px;border-radius:14px;font-weight:800}
main{max-width:1100px;margin:auto;padding:24px 16px}.hero{border-radius:28px;padding:28px;background:linear-gradient(135deg,#fff,#eef5ff);box-shadow:0 12px 35px #20356b18}
h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}.subtitle{color:#53627d;font-size:17px}
.map{margin-top:24px;position:relative;padding:18px 4px}.path{height:8px;background:#d7deef;border-radius:10px;position:absolute;left:70px;right:70px;top:85px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;position:relative}
.level{background:#fff;border:2px solid #e2e7f2;border-radius:20px;padding:17px 10px;text-align:center;min-height:150px;box-shadow:0 7px 18px #17203312;cursor:pointer;transition:.18s}.level:hover{transform:translateY(-5px)}.level.locked{filter:grayscale(.8);opacity:.55;cursor:not-allowed}.icon{font-size:42px}.level b{display:block;margin:6px 0}.stars{letter-spacing:2px;font-size:14px}
.card{background:#fff;border-radius:24px;padding:25px;margin-top:22px;box-shadow:0 9px 28px #17203312}.question{font-size:24px;font-weight:800;margin:18px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.opt{border:2px solid #dce3f0;background:#fff;border-radius:15px;padding:16px;font-size:18px;font-weight:750;cursor:pointer}.opt:hover{background:#f0f4ff}.correct{background:#dcfce7!important;border-color:#22a35a!important}.wrong{background:#fee2e2!important;border-color:#ef4444!important}
.feedback{min-height:42px;margin-top:15px;font-weight:750}.next{display:none;background:#243b80;color:#fff;border:0;padding:13px 20px;border-radius:12px;font-weight:800;cursor:pointer}
.mission{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:9px 13px;background:#eef2ff;border-radius:999px;font-weight:700}.back{color:#fff;text-decoration:none}
@media(max-width:750px){.levels{grid-template-columns:repeat(2,1fr)}.path{display:none}.options{grid-template-columns:1fr}.level:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><a class="back" href="student.html">← GANITVA</a><div class="logo">🏔️ PATTERN MOUNTAINS</div><div class="xp">⭐ <span id="xp">0</span> XP</div></header>
<main>
<section class="hero">
<h1>Pattern Mountains</h1>
<div class="subtitle">Your mission: discover the hidden rules behind numbers and shapes.</div>
<div class="mission"><span class="pill">🎯 10 Missions</span><span class="pill">⭐ Earn XP</span><span class="pill">🔓 Unlock the path</span></div>
<div class="map"><div class="path"></div><div class="levels" id="levels"></div></div>
</section>
<section class="card" id="play" style="display:none">
<div id="missionTitle"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Continue →</button>
</section>
</main>
<script>
const data=[
["🔍","Pattern Detective","What comes next? 1, 3, 5, 7, ___",[8,9,10,11],9,"These are consecutive odd numbers: add 2 each time."],
["🧩","Sequence Builder","What is the next triangular number? 1, 3, 6, 10, ___",[12,14,15,16],15,"Add 2, then 3, then 4, then 5."],
["🟦","Picture the Numbers","Which number is both triangular and square?",[25,30,36,40],36,"36 is both a square number and a triangular number."],
["⚡","Odd-to-Square Lab","1 + 3 + 5 + 7 = ?",[14,16,18,20],16,"The first four odd numbers add to 4² = 16."],
["🔷","Polygon Lab","A regular polygon with 8 sides is called…",["Hexagon","Heptagon","Octagon","Decagon"],"Octagon","A polygon with 8 sides is an octagon."],
["🚀","Pattern Master","What is 2⁶?",[32,48,64,72],64,"2⁶ means six factors of 2: 64."],
["🔗","Sequence Relations","1+3=4, 3+6=9, 6+10=16, 10+15=25. The results are…",["Prime numbers","Square numbers","Cube numbers","Odd numbers"],"Square numbers","The results are 2², 3², 4² and 5²."],
["🕵️","Shape Detective","In the side-count sequence 3,4,5,6,7,8,9,10, the 8th shape has… sides.",["8","9","10","11"],"10","The 8th term is 10."],
["❄️","Koch Explorer","The Koch sequence begins 3, 12, 48. What comes next?",[96,144,192,240],192,"Each term is multiplied by 4."],
["👑","Pattern Boss","The sum of the first 10 odd numbers is…",[81,90,100,110],100,"The sum of the first n odd numbers is n², so 10² = 100."]
];
let xp=+localStorage.getItem("ganitvaXP")||0, unlocked=+localStorage.getItem("g1unlocked")||1, current=0;
document.getElementById("xp").textContent=xp;
const levels=document.getElementById("levels");
function draw(){levels.innerHTML="";data.forEach((g,i)=>{let d=document.createElement("div");d.className="level "+(i<unlocked?"":"locked");d.innerHTML=`<div class="icon">${g[0]}</div><b>${i+1}. ${g[1]}</b><div class="stars">${i<unlocked?"⭐":"🔒"}</div>`;if(i<unlocked)d.onclick=()=>start(i);levels.appendChild(d)})}
function start(i){current=i;let g=data[i];document.getElementById("play").style.display="block";missionTitle.textContent=`Mission ${i+1} — ${g[1]}`;question.textContent=g[2];feedback.textContent="";next.style.display="none";options.innerHTML=g[3].map(o=>`<button class="opt">${o}</button>`).join("");options.querySelectorAll("button").forEach(b=>b.onclick=()=>answer(b,g));document.getElementById("play").scrollIntoView({behavior:"smooth"})}
function answer(btn,g){options.querySelectorAll("button").forEach(b=>b.disabled=true);let ok=String(btn.textContent)===String(g[4]);btn.classList.add(ok?"correct":"wrong");if(ok){xp+=10;localStorage.setItem("ganitvaXP",xp);document.getElementById("xp").textContent=xp;feedback.textContent="🎉 Correct! "+g[5];if(current+1<10){unlocked=Math.max(unlocked,current+2);localStorage.setItem("g1unlocked",unlocked);next.style.display="inline-block"}else{feedback.textContent="🏆 Pattern Boss defeated! Chapter 1 mission complete.";next.style.display="none"}}else{feedback.textContent="💡 Keep exploring. Correct answer: "+g[4]+". "+g[5];next.style.display="inline-block"}draw()}
next.onclick=()=>start(Math.min(current+1,9));draw();
</script>
</body></html>
