<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANITVA — Pattern Mountains</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#172033;background:linear-gradient(135deg,#eaf6ff,#fff7e6,#f3edff);background-size:300% 300%;animation:bg 14s ease infinite;min-height:100vh}
@keyframes bg{50%{background-position:100% 50%}}
header{padding:17px 5%;background:linear-gradient(135deg,#1d347f,#654fd2);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 6px 22px #17203344}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:23px}.xp{background:#ffffff22;padding:10px 15px;border-radius:14px;font-weight:900}
main{max-width:1100px;margin:auto;padding:24px 15px}.hero{background:#ffffffdf;border-radius:30px;padding:25px;box-shadow:0 12px 35px #17203318;text-align:center}.hero h1{font-size:clamp(31px,6vw,53px);margin:0}.hero p{color:#5e6c84}.map{margin-top:20px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.level{background:#fff;border:2px solid #e2e7f2;border-radius:21px;padding:15px 8px;min-height:145px;box-shadow:0 7px 18px #17203312;cursor:pointer;transition:.2s;animation:pop .6s both}.level:hover{transform:translateY(-7px) rotate(-1deg);box-shadow:0 15px 27px #17203320}.level.locked{filter:grayscale(.8);opacity:.5;cursor:not-allowed}.icon{font-size:43px}.level b{display:block;margin:6px 0}.stars{font-size:15px}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.card{background:#fff;border-radius:28px;padding:27px;margin-top:22px;box-shadow:0 10px 30px #17203315}.mission{font-size:18px;font-weight:900;color:#4058c9}.question{font-size:clamp(22px,4vw,30px);font-weight:900;margin:20px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.opt{border:2px solid #dce3f0;background:#fff;border-radius:16px;padding:17px;font-size:18px;font-weight:800;cursor:pointer;transition:.15s}.opt:hover{transform:scale(1.02);background:#f1f4ff}.correct{background:#dcfce7!important;border-color:#20a35b!important}.wrong{background:#fee2e2!important;border-color:#ef4444!important}.feedback{font-weight:850;font-size:18px;min-height:48px;margin-top:17px}.next{display:none;background:linear-gradient(135deg,#4058c9,#7358d7);color:#fff;border:0;padding:14px 21px;border-radius:13px;font-weight:900;font-size:16px;cursor:pointer}
.back{color:#fff;text-decoration:none}.bar .back{margin-right:auto;margin-right:20px}
.overlay{position:fixed;inset:0;background:#172033cc;display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.celebrate{position:relative;background:#fff;border-radius:32px;padding:38px 25px;text-align:center;max-width:600px;width:100%;box-shadow:0 25px 80px #0006;animation:zoom .5s cubic-bezier(.2,1.5,.4,1)}@keyframes zoom{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.celebrate h2{font-size:42px;margin:5px 0}.big100{font-size:80px;font-weight:1000;line-height:1;background:linear-gradient(135deg,#ffb000,#ff4d6d,#704cff);-webkit-background-clip:text;color:transparent;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.close{border:0;background:#243b80;color:#fff;padding:13px 22px;border-radius:13px;font-weight:900;cursor:pointer}.confetti{position:absolute;top:-20px;font-size:25px;animation:conf 2.6s linear infinite}.confetti:nth-child(1){left:5%}.confetti:nth-child(2){left:20%;animation-delay:.4s}.confetti:nth-child(3){left:40%;animation-delay:.9s}.confetti:nth-child(4){left:60%;animation-delay:.2s}.confetti:nth-child(5){left:80%;animation-delay:.7s}.confetti:nth-child(6){left:94%;animation-delay:1.1s}@keyframes conf{to{transform:translateY(600px) rotate(500deg);opacity:0}}
@media(max-width:760px){.levels{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.level:last-child{grid-column:1/-1}}
</style></head>
<body>
<header><div class="bar"><a class="back" href="student.html">← GANITVA</a><div class="logo">🏔️ PATTERN MOUNTAINS</div><div class="xp">⭐ <span id="xp">0</span> XP</div></div></header>
<main><section class="hero"><h1>🏔️ Pattern Mountains</h1><p>Every mountain hides a pattern. Can you discover it?</p><div class="map"><div class="levels" id="levels"></div></div></section>
<section class="card" id="play" style="display:none"><div class="mission" id="missionTitle"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Continue to the Next Mission →</button></section></main>
<div class="overlay" id="overlay"><div class="celebrate"><span class="confetti">✦</span><span class="confetti">✧</span><span class="confetti">✦</span><span class="confetti">✧</span><span class="confetti">✦</span><span class="confetti">✧</span><div style="font-size:55px">🎉✨🏆✨🎉</div><div class="big100">100%</div><h2>AMAZING!</h2><p id="celebrateText">You completed the Pattern Mountains challenge!</p><p style="font-size:20px;font-weight:850">🌟 You are a true Pattern Master! 🌟</p><button class="close" onclick="overlay.style.display='none'">Continue My Adventure 🚀</button></div></div>
<script>
const data=[
["🔍","Pattern Detective","What comes next? 1, 3, 5, 7, ___",[8,9,10,11],9,"These are consecutive odd numbers: add 2 each time."],
["🧩","Sequence Builder","What is the next triangular number? 1, 3, 6, 10, ___",[12,14,15,16],15,"Add 2, then 3, then 4, then 5."],
["🟦","Picture the Numbers","Which number is both triangular and square?",[25,30,36,40],36,"36 is both a square number and a triangular number."],
["⚡","Odd-to-Square Lab","1 + 3 + 5 + 7 = ?",[14,16,18,20],16,"The first four odd numbers add to 4² = 16."],
["🔷","Polygon Lab","A regular polygon with 8 sides is called…",["Hexagon","Heptagon","Octagon","Decagon"],"Octagon","A polygon with 8 sides is an octagon."],
["🚀","Pattern Master","What is 2⁶?",[32,48,64,72],64,"2⁶ means six factors of 2: 64."],
["🔗","Sequence Relations","1+3=4, 3+6=9, 6+10=16, 10+15=25. The results are…",["Prime numbers","Square numbers","Cube numbers","Odd numbers"],"Square numbers","The results are 2², 3², 4² and 5²."],
["🕵️","Shape Detective","In the side-count sequence 3,4,5,6,7,8,9,10, the 8th shape has… sides.",["8","9","10","11"],"10","The 8th term is 10."],
["❄️","Koch Explorer","The Koch sequence begins 3, 12, 48. What comes next?",[96,144,192,240],192,"Each term is multiplied by 4."],
["👑","Pattern Boss","The sum of the first 10 odd numbers is…",[81,90,100,110],100,"The sum of the first n odd numbers is n², so 10² = 100."]
];
let xp=+localStorage.getItem("ganitvaXP")||0, unlocked=+localStorage.getItem("g1unlocked")||1, current=0;
const xpEl=document.getElementById("xp");xpEl.textContent=xp;
function draw(){levels.innerHTML="";data.forEach((g,i)=>{let d=document.createElement("div");d.className="level "+(i<unlocked?"":"locked");d.innerHTML=`<div class="icon">${g[0]}</div><b>${i+1}. ${g[1]}</b><div class="stars">${i<unlocked?"⭐":"🔒"}</div>`;if(i<unlocked)d.onclick=()=>start(i);levels.appendChild(d)})}
function start(i){current=i;let g=data[i];play.style.display="block";missionTitle.textContent=`Mission ${i+1} — ${g[1]}`;question.textContent=g[2];feedback.textContent="";next.style.display="none";options.innerHTML=g[3].map(o=>`<button class="opt">${o}</button>`).join("");options.querySelectorAll("button").forEach(b=>b.onclick=()=>answer(b,g));play.scrollIntoView({behavior:"smooth"})}
function answer(btn,g){options.querySelectorAll("button").forEach(b=>b.disabled=true);let ok=String(btn.textContent)===String(g[4]);btn.classList.add(ok?"correct":"wrong");if(ok){xp+=10;localStorage.setItem("ganitvaXP",xp);xpEl.textContent=xp;feedback.textContent="🎉 CORRECT! "+g[5];if(current+1<10){unlocked=Math.max(unlocked,current+2);localStorage.setItem("g1unlocked",unlocked);next.style.display="inline-block"}else{feedback.textContent="🏆 PERFECT! You defeated the Pattern Boss!";setTimeout(()=>{overlay.style.display="flex"},450)}}else{feedback.textContent="💡 Keep thinking! Correct answer: "+g[4]+". "+g[5];next.style.display="inline-block"}draw()}
next.onclick=()=>start(Math.min(current+1,9));draw();
</script></body></html>
